name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-proxy
          path: Native~/Windows/x86_64/UnityPlayer.dll

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: bash ./scripts/build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-proxy
          path: Native~/Linux/x86_64/UnityPlayer.so

  package:
    needs: [windows, linux]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-proxy
          path: Native~/Windows/x86_64
      - uses: actions/download-artifact@v4
        with:
          name: linux-proxy
          path: Native~/Linux/x86_64
      - name: Create Unity packages
        shell: bash
        run: python3 scripts/create-release-packages.py --version "${GITHUB_REF_NAME#v}" --output-dir dist
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
