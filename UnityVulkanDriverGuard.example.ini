; The Unity postprocessor generates this file in the player build directory.
; Rules intentionally follow UE5's numeric DriverDenyList comparison model.
[Global]
MinimumVulkanVersion=1.1

[GPU_NVIDIA]
SuggestedDriverVersion=516.25
DownloadURL=https://www.nvidia.com/Download/index.aspx
+DriverDenyList=<516.25|Known Vulkan driver issues

[GPU_AMD]
SuggestedDriverVersion=22.5.1
DownloadURL=https://www.amd.com/en/support/download/drivers.html
+DriverDenyList=<22.5.1|Known Vulkan driver issues

[GPU_INTEL]
SuggestedDriverVersion=101.3413
DownloadURL=https://www.intel.com/content/www/us/en/download-center/home.html
+DriverDenyList=<101.3413|Known Vulkan driver issues

