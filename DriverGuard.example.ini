; The Unity postprocessor generates DriverGuard.ini in the player build directory.
; Rules follow UE5's DriverVersion/RHIName/AdapterNameRegex model.
; DeviceId and DriverId are Vulkan-specific selectors.
; Recommended Windows driver baselines from early 2026.
[Global]
MinimumVulkanVersion=1.1
; RenderAPI: comma-separated "Vulkan" and/or "D3D12" (defaults to Vulkan only).
RenderAPI=Vulkan,D3D12
; MinimumFeatureLevel: 11_0 | 11_1 | 12_0 | 12_1 (D3D12 only, defaults to 11_0).
MinimumFeatureLevel=12_0

[GPU_NVIDIA]
MinimumDriverVersion=591.86
SuggestedDriverVersion=591.86
DownloadURL=https://www.nvidia.com/Download/index.aspx

[GPU_AMD]
MinimumDriverVersion=26.1.1
SuggestedDriverVersion=26.1.1
DownloadURL=https://www.amd.com/en/support/download/drivers.html

[GPU_INTEL]
MinimumDriverVersion=101.8362
SuggestedDriverVersion=101.8362
DownloadURL=https://www.intel.com/content/www/us/en/download-center/home.html
