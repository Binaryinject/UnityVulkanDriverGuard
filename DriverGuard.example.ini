; The Unity postprocessor generates DriverGuard.ini in the player build directory.
; Rules follow UE5's DriverVersion/RHIName/AdapterNameRegex model.
; DeviceId and DriverId are Vulkan-specific selectors.
[Global]
MinimumVulkanVersion=1.1

[GPU_NVIDIA]
SuggestedDriverVersion=516.25
DownloadURL=https://www.nvidia.com/Download/index.aspx
+DriverDenyList=(DriverVersion="<516.25",RHIName="Vulkan",DeviceId="0x1B80-0x1B8F",DriverId="NVIDIA_PROPRIETARY",Reason="Known Vulkan driver issue")

[GPU_AMD]
SuggestedDriverVersion=22.5.1
DownloadURL=https://www.amd.com/en/support/download/drivers.html
+DriverDenyList=(DriverVersion="<22.5.1",RHIName="Vulkan",AdapterNameRegex=".*RX 5[0-9]{2}.*",DriverId="AMD_PROPRIETARY,AMD_OPEN_SOURCE,MESA_RADV",Reason="Known Vulkan driver issue")

[GPU_INTEL]
SuggestedDriverVersion=101.3413
DownloadURL=https://www.intel.com/content/www/us/en/download-center/home.html
+DriverDenyList=(DriverVersion="<101.3413",RHIName="Vulkan",AdapterNameRegex=".*(UHD|Iris).*",DriverId="INTEL_PROPRIETARY_WINDOWS,INTEL_OPEN_SOURCE_MESA",Reason="Known Vulkan driver issue")
